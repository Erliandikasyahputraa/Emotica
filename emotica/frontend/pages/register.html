<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Emotica</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/main.css">

</head>
<body class="min-h-screen bg-bg text-text">
    <!-- Navigation -->
    <nav class="bg-bg border-b-2 border-text sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-xl font-bold text-text">Emotica</a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="dashboard.html" class="nav-link">Dashboard</a>
                    <a href="history.html" class="nav-link">History</a>
                    <a href="about.html" class="nav-link">About</a>
                    <a href="login.html" class="nav-link">Login</a>
                    <a href="register.html" class="nav-link">Sign Up</a>
                    <div class="flex items-center gap-4">
                        <button class="theme-toggle p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700" id="themeToggle" aria-label="Toggle theme">
                            <svg id="sunIcon" class="w-5 h-5 text-gray-700 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                            </svg>
                            <svg id="moonIcon" class="w-5 h-5 hidden text-gray-700 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="md:hidden flex items-center">
                    <button id="mobileMenuBtn" class="p-2 rounded-md text-text">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile menu -->
        <div class="md:hidden hidden" id="mobileMenu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 bg-bg border-t-2 border-border">
                <a href="index.html" class="block px-3 py-2 text-text hover:bg-accent/10 rounded-md">Home</a>
                <a href="dashboard.html" class="block px-3 py-2 text-text hover:bg-accent/10 rounded-md">Dashboard</a>
                <a href="history.html" class="block px-3 py-2 text-text hover:bg-accent/10 rounded-md">History</a>
                <a href="about.html" class="block px-3 py-2 text-text hover:bg-accent/10 rounded-md">About</a>
                <div class="pt-4 pb-3 border-t border-border mt-4">
                    <div class="flex items-center justify-center space-x-4">
                        <a href="login.html" class="block px-4 py-2 text-gray-700 dark:text-gray-200 hover:bg-accent/10 rounded-md font-medium">Login</a>
                        <a href="register.html" class="px-4 py-2 bg-accent text-white font-medium rounded-md hover:bg-accent/90">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Registration Form -->
    <div class="min-h-[calc(100vh-6rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-bg">
        <div class="max-w-md w-full space-y-8 p-8 bg-bg border-2 border-text rounded-lg">
            <div>
                <h2 class="mt-6 text-center text-3xl font-extrabold">
                    Create your account
                </h2>
                <p class="mt-2 text-center text-sm text-text/70">
                    Already have an account?
                    <a href="login.html" class="font-medium text-accent hover:opacity-80">
                        Sign in
                    </a>
                </p>
            </div>
            <form class="mt-8 space-y-6" id="registerForm">
                <div class="space-y-4">
                    <div>
                        <label for="email-address" class="sr-only">Email address</label>
                        <input id="email-address" name="email" type="email" autocomplete="email" required 
                            class="appearance-none block w-full px-4 py-3 border-2 border-text bg-bg text-text placeholder-text/50 focus:outline-none focus:ring-2 focus:ring-accent/50 sm:text-sm" 
                            placeholder="Email address">
                    </div>
                    <div>
                        <label for="password" class="sr-only">Password</label>
                        <input id="password" name="password" type="password" autocomplete="new-password" required 
                            class="appearance-none block w-full px-4 py-3 border-2 border-text bg-bg text-text placeholder-text/50 focus:outline-none focus:ring-2 focus:ring-accent/50 sm:text-sm" 
                            placeholder="Password">
                    </div>
                    <div>
                        <label for="confirm-password" class="sr-only">Confirm Password</label>
                        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required 
                            class="appearance-none block w-full px-4 py-3 border-2 border-text bg-bg text-text placeholder-text/50 focus:outline-none focus:ring-2 focus:ring-accent/50 sm:text-sm" 
                            placeholder="Confirm Password">
                    </div>
                </div>

                <button type="submit" 
                    class="w-full py-2 px-4 bg-accent text-text font-medium text-center rounded-md border border-text hover:bg-accent/90 hover:shadow-sm transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent/50">
                    Create Account
                </button>
                <div id="error-message" class="text-red-500 text-sm text-center hidden">
                    There was an error creating your account. Please try again.
                </div>
                <div id="success-message" class="text-green-500 text-sm text-center hidden">
                    Registration successful! Redirecting to login...
                </div>
            </form>
            

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-bg border-t-2 border-text py-12">
        <div class="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-sm text-text/70">
                &copy; 2023 Emotica. All rights reserved.
            </p>
        </div>
    </footer>

    <script src="../js/auth.js" type="module"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Checkbox functionality with animations
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                const checkIcon = checkbox.nextElementSibling;
                
                // Initial state
                if (checkbox.checked) {
                    checkIcon.classList.remove('hidden');
                }
                
                // Toggle checkmark on click
                checkbox.addEventListener('change', () => {
                    if (checkbox.checked) {
                        checkIcon.classList.remove('hidden');
                        checkIcon.animate([
                            { transform: 'scale(0.5) rotate(-10deg)', opacity: 0 },
                            { transform: 'scale(1.2) rotate(5deg)', opacity: 1 },
                            { transform: 'scale(1) rotate(0)', opacity: 1 }
                        ], { duration: 300, easing: 'ease-out' });
                    } else {
                        checkIcon.classList.add('hidden');
                    }
                });
                
                // Add focus styles
                checkbox.addEventListener('focus', () => {
                    checkbox.parentElement.classList.add('ring-2', 'ring-offset-2', 'ring-accent/50');
                });
                
                checkbox.addEventListener('blur', () => {
                    checkbox.parentElement.classList.remove('ring-2', 'ring-offset-2', 'ring-accent/50');
                });
            });
            
            // Theme toggle
            const themeToggle = document.getElementById('themeToggle');
            const sunIcon = document.getElementById('sunIcon');
            const moonIcon = document.getElementById('moonIcon');
            
            // Check for saved theme preference
            const currentTheme = localStorage.getItem('theme') || 'light';
            if (currentTheme === 'dark') {
              document.documentElement.setAttribute('data-theme', 'dark');
              sunIcon.classList.add('hidden');
              moonIcon.classList.remove('hidden');
            } else {
              document.documentElement.setAttribute('data-theme', 'light');
              sunIcon.classList.remove('hidden');
              moonIcon.classList.add('hidden');
            }
            
            // Toggle theme
            if (themeToggle) {
              themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                if (currentTheme === 'dark') {
                  document.documentElement.setAttribute('data-theme', 'light');
                  localStorage.setItem('theme', 'light');
                  sunIcon.classList.remove('hidden');
                  moonIcon.classList.add('hidden');
                } else {
                  document.documentElement.setAttribute('data-theme', 'dark');
                  localStorage.setItem('theme', 'dark');
                  sunIcon.classList.add('hidden');
                  moonIcon.classList.remove('hidden');
                }
              });
            }

    // Mobile menu toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const navLinks = document.getElementById('navLinks');
    
    if (mobileMenuBtn && navLinks) {
      mobileMenuBtn.addEventListener('click', () => {
        navLinks.classList.toggle('active');
      });
    }
    
    // Update active link
    const currentPage = window.location.pathname.split('/').pop() || 'register.html';
    document.querySelectorAll('.nav-link').forEach(link => {
      if (link.getAttribute('href') === currentPage) {
        link.classList.add('active');
      }
    });
  });
</script>
</body>
</html>
